<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NES Dumper - Famicom ROM Reader</title>
  <style>
    :root {
      --bg: #1a1a24;
      --card-bg: #242436;
      --accent: #e52521; /* Famicom Red */
      --accent-hover: #ff3b30;
      --gold: #d4af37;  /* Famicom Gold */
      --text: #f0f0f5;
      --text-dim: #9b9ba8;
      --border: #36364f;
      --success: #34c759;
      --console-bg: #101018;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    h1 {
      font-size: 1.6rem;
      color: var(--gold);
      letter-spacing: 0.5px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gold);
    }
    .btn {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }
    .btn:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #fff;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    select, input {
      width: 100%;
      background: var(--console-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--gold);
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      background: #444;
    }
    .status-connected { background: var(--success); color: #000; }
    .status-disconnected { background: #555; color: #bbb; }

    /* Progress bar */
    .progress-box {
      margin: 16px 0;
      display: none;
    }
    .progress-bar-bg {
      background: var(--console-bg);
      border-radius: 6px;
      height: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
    }
    .progress-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
      text-align: right;
    }

    /* Console */
    .console-card {
      margin-top: 20px;
    }
    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    #consoleLog {
      background: var(--console-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.85rem;
      color: #9feaf9;
      height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    /* CHR Preview */
    .preview-card {
      margin-top: 20px;
    }
    #chrCanvas {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      image-rendering: pixelated;
      max-width: 100%;
      display: block;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span class="badge">FC 60P</span>
        <h1>NES ROM Dumper (Arduino Mega)</h1>
      </div>
      <div>
        <span id="connStatus" class="status-badge status-disconnected">未接続</span>
      </div>
    </header>

    <div class="grid">
      <!-- 接続 & テストカード -->
      <div class="card">
        <h2>🔌 1. 接続 & テスト</h2>
        <div style="display: flex; gap: 10px; margin-bottom: 16px;">
          <button id="btnConnect" class="btn btn-primary">シリアルポート接続</button>
          <button id="btnDisconnect" class="btn" disabled>切断</button>
        </div>
        <p style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 12px;">
          Arduino Mega 2560 が接続されたCOMポート（例: COM3）を選択してください。
        </p>
        <div style="display: flex; gap: 10px; margin-bottom: 12px;">
          <button id="btnTest" class="btn" disabled>疎通テスト (TEST)</button>
<button id="btnPinCheck" class="btn" disabled style="border-color: #10b981; color: #10b981;">🔍 全ピン接触診断</button>
          <button id="btnWireCheck" class="btn" disabled style="border-color: #f59e0b; color: #f59e0b;">⚡ 配線・短絡診断</button>
          <button id="btnDiag" class="btn" disabled>🔄 バンク切替診断</button>
        </div>
      </div>

      <!-- カートリッジ設定 & 吸い出しカード -->
      <div class="card">
        <h2>🎮 2. 吸い出し設定</h2>
        <div class="form-group">
          <label>タイトルプリセット</label>
          <select id="presetSelect">
            <option value="ninjakun">忍者くん 魔城の冒険 (NROM-128 / 16KB PRG + 8KB CHR)</option>
<option value="mahjong4">4人打ち麻雀 (NROM-128 / 16KB PRG + 8KB CHR / 垂直ミラー)</option>
            <option value="starsoldier">スターソルジャー (Mapper 3 CNROM / 32KB PRG + 32KB CHR)</option>
            <option value="mighty">マイティボンジャック (高互換 Mapper 0 / 32KB PRG + 8KB CHR)</option>
            <option value="mighty_mapper185">マイティボンジャック (原本仕様 Mapper 185 / 32KB PRG + 8KB CHR)</option>
            <option value="smb1" selected>スーパーマリオブラザーズ (NROM-256 / 32KB PRG + 8KB CHR / 垂直ミラー)</option>
            <option value="famista88">プロ野球ファミリースタジアム'88 (高互換 Mapper 4 / 128KB PRG + 64KB CHR / 垂直ミラー)</option>
            <option value="smb3">スーパーマリオブラザーズ3 (Mapper 4 MMC3 / 256KB PRG + 128KB CHR)</option>
            <option value="nrom256">NROM-256 (32KB PRG + 8KB CHR) 例: マリオ等</option>
            <option value="custom">カスタム設定</option>
          </select>
        </div>
        <div class="form-group">
          <label>ファイル名 (.nes)</label>
          <input type="text" id="outFileName" value="ninjakun_majou.nes">
        </div>
        <div id="customSettings" style="display: none;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label>PRG-ROM (KB)</label>
              <select id="prgSize">
                <option value="16">16 KB ($C000-$FFFF)</option>
                <option value="32">32 KB ($8000-$FFFF)</option>
                <option value="128">128 KB (16バンク / ファミスタ等)</option>
                <option value="256">256 KB (MMC3等 バンク切替)</option>
              </select>
            </div>
            <div class="form-group">
              <label>CHR-ROM (KB)</label>
              <select id="chrSize">
                <option value="8">8 KB ($0000-$1FFF)</option>
                <option value="16">16 KB (2バンク)</option>
                <option value="32">32 KB (4バンク)</option>
                <option value="64">64 KB (8バンク / ファミスタ等)</option>
                <option value="128">128 KB (MMC3等 16バンク)</option>
                <option value="0">0 KB (CHR-RAM)</option>
              </select>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label>マッパー</label>
              <select id="mapperSelect">
                <option value="0">Mapper 0 (NROM)</option>
                <option value="3">Mapper 3 (CNROM バンク切替)</option>
                <option value="4">Mapper 4 (MMC3)</option>
                <option value="185">Mapper 185 (CNROM セキュリティプロテクト)</option>
                <option value="206">Mapper 206 (Namcot 108/118 ファミスタ等)</option>
              </select>
            </div>
            <div class="form-group">
              <label>ミラーリング</label>
              <select id="mirroring">
                <option value="1">Vertical (忍者くん, スターソルジャー等)</option>
                <option value="0">Horizontal</option>
              </select>
            </div>
          </div>
        </div>

        <button id="btnDump" class="btn btn-primary" style="width: 100%; margin-top: 10px;" disabled>
          ROM吸い出し開始 (.nes生成)
        </button>

        <div id="progressBox" class="progress-box">
          <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <div id="progressLabel" class="progress-label">0%</div>
        </div>
      </div>
    </div>

    <!-- CHR グラフィックプレビュー -->
    <div class="card preview-card">
      <h2>🖼️ CHR キャラクタプレビュー (2bpp Tile Viewer)</h2>
      <p style="font-size: 0.85rem; color: var(--text-dim);">
        吸い出したCHR-ROM（8KB = 512タイル）のパターンテーブル画像です。正常に吸い出せていればキャラクタが確認できます。
      </p>
      <canvas id="chrCanvas" width="256" height="128"></canvas>
    </div>

    <!-- コンソールログ -->
    <div class="card console-card">
      <div class="console-header">
        <h2>💻 ログ & デバッグ出力</h2>
        <button id="btnClearLog" class="btn" style="padding: 4px 8px; font-size: 0.75rem;">クリア</button>
      </div>
      <div id="consoleLog"></div>
    </div>
  </div>

  <script>
    // State
    let port = null;
    let reader = null;
    let writer = null;
    let isConnected = false;

    // Elements
    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const btnTest = document.getElementById('btnTest');
    const btnPinCheck = document.getElementById('btnPinCheck');
    const btnWireCheck = document.getElementById('btnWireCheck');
    const btnDiag = document.getElementById('btnDiag');
    const btnDump = document.getElementById('btnDump');
    const connStatus = document.getElementById('connStatus');
    const consoleLog = document.getElementById('consoleLog');
    const btnClearLog = document.getElementById('btnClearLog');
    const presetSelect = document.getElementById('presetSelect');
    const customSettings = document.getElementById('customSettings');
    const outFileName = document.getElementById('outFileName');
    const prgSizeSelect = document.getElementById('prgSize');
    const chrSizeSelect = document.getElementById('chrSize');
    const mirroringSelect = document.getElementById('mirroring');
    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const chrCanvas = document.getElementById('chrCanvas');
    const chrCtx = chrCanvas.getContext('2d');

    function log(msg) {
      consoleLog.textContent += msg + '\n';
      consoleLog.scrollTop = consoleLog.scrollHeight;
    }

    btnClearLog.addEventListener('click', () => {
      consoleLog.textContent = '';
    });

    const mapperSelect = document.getElementById('mapperSelect');

    presetSelect.addEventListener('change', () => {
      if (presetSelect.value === 'ninjakun') {
        customSettings.style.display = 'none';
        outFileName.value = 'ninjakun_majou.nes';
        prgSizeSelect.value = '16';
        chrSizeSelect.value = '8';
        mapperSelect.value = '0';
        mirroringSelect.value = '1';
      } else if (presetSelect.value === 'mahjong4') {
        customSettings.style.display = 'none';
        outFileName.value = '4nin_uchi_mahjong.nes';
        prgSizeSelect.value = '16';
        chrSizeSelect.value = '8';
        mapperSelect.value = '0';
        mirroringSelect.value = '1'; // Vertical
      } else if (presetSelect.value === 'starsoldier') {
        customSettings.style.display = 'none';
        outFileName.value = 'star_soldier.nes';
        prgSizeSelect.value = '32';
        chrSizeSelect.value = '32';
        mapperSelect.value = '3';
        mirroringSelect.value = '1';
      } else if (presetSelect.value === 'mighty') {
        customSettings.style.display = 'none';
        outFileName.value = 'mighty_bomb_jack_mapper0.nes';
        prgSizeSelect.value = '32';
        chrSizeSelect.value = '8';
        mapperSelect.value = '0'; // Mapper 0 for maximum emulator compatibility
        mirroringSelect.value = '0'; // Horizontal Mirroring
      } else if (presetSelect.value === 'mighty_mapper185') {
        customSettings.style.display = 'none';
        outFileName.value = 'mighty_bomb_jack_mapper185.nes';
        prgSizeSelect.value = '32';
        chrSizeSelect.value = '8';
        mapperSelect.value = '185'; // Original Mapper 185
        mirroringSelect.value = '0'; // Horizontal Mirroring
      } else if (presetSelect.value === 'smb1') {
        customSettings.style.display = 'none';
        outFileName.value = 'super_mario_bros.nes';
        prgSizeSelect.value = '32';
        chrSizeSelect.value = '8';
        mapperSelect.value = '0';
        mirroringSelect.value = '1'; // Vertical
      } else if (presetSelect.value === 'famista88') {
        customSettings.style.display = 'none';
        outFileName.value = 'famista88.nes';
        prgSizeSelect.value = '128';
        chrSizeSelect.value = '64';
        mapperSelect.value = '4'; // High compatibility Mapper 4 (MMC3)
        mirroringSelect.value = '1'; // Vertical
      } else if (presetSelect.value === 'smb3') {
        customSettings.style.display = 'none';
        outFileName.value = 'super_mario_bros_3.nes';
        prgSizeSelect.value = '256';
        chrSizeSelect.value = '128';
        mapperSelect.value = '4'; // MMC3
        mirroringSelect.value = '0'; // Horizontal
      } else if (presetSelect.value === 'nrom256') {
        customSettings.style.display = 'none';
        outFileName.value = 'game_nrom256.nes';
        prgSizeSelect.value = '32';
        chrSizeSelect.value = '8';
        mapperSelect.value = '0';
        mirroringSelect.value = '0';
      } else {
        customSettings.style.display = 'block';
      }
    });

    // Initialize preset values
    presetSelect.dispatchEvent(new Event('change'));

    // WebSerial Connect
    btnConnect.addEventListener('click', async () => {
      if (!('serial' in navigator)) {
        alert('お使いのブラウザはWebSerial APIに対応していません。Google ChromeまたはMicrosoft Edgeをご利用ください。');
        return;
      }
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        isConnected = true;
        btnConnect.disabled = true;
        btnDisconnect.disabled = false;
        btnTest.disabled = false;
        btnPinCheck.disabled = false; btnWireCheck.disabled = false; btnDiag.disabled = false;
        btnDump.disabled = false;
        connStatus.textContent = '接続中';
        connStatus.className = 'status-badge status-connected';
        log('シリアルポートに接続しました (115200 bps)');

        // Wait a bit for Arduino reset, then verify handshake
        await new Promise(r => setTimeout(r, 1800));
        await drainSerial(200);
        await sendCommand('PING');
        const pong = await readLine(2000);
        if (pong) log('ハンドシェイク応答: ' + pong);
      } catch (err) {
        log('接続エラー: ' + err.message);
      }
    });

    btnDisconnect.addEventListener('click', async () => {
      try {
        if (reader) { await reader.cancel(); reader = null; }
        if (port) { await port.close(); port = null; }
        isConnected = false;
        btnConnect.disabled = false;
        btnDisconnect.disabled = true;
        btnTest.disabled = true;
        btnPinCheck.disabled = true; btnWireCheck.disabled = true; btnDiag.disabled = true;
        btnDump.disabled = true;
        connStatus.textContent = '未接続';
        connStatus.className = 'status-badge status-disconnected';
        log('切断しました。');
      } catch (err) {
        log('切断エラー: ' + err.message);
      }
    });

    async function sendCommand(cmd) {
      if (!port || !port.writable) return;
      const encoder = new TextEncoder();
      const writer = port.writable.getWriter();
      await writer.write(encoder.encode(cmd + '\n'));
      writer.releaseLock();
    }

    async function readLine(timeoutMs = 3000) {
      const reader = port.readable.getReader();
      let buffer = '';
      const startTime = Date.now();
      try {
        while (Date.now() - startTime < timeoutMs) {
          const { value, done } = await Promise.race([
            reader.read(),
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 500))
          ]).catch(() => ({ value: null, done: false }));

          if (value) {
            buffer += new TextDecoder().decode(value);
            const nl = buffer.indexOf('\n');
            if (nl !== -1) {
              const line = buffer.substring(0, nl).trim();
              reader.releaseLock();
              return line;
            }
          }
        }
      } catch (e) {
      } finally {
        try { reader.releaseLock(); } catch (_) {}
      }
      return null;
    }

    // Test command
    btnTest.addEventListener('click', async () => {
      btnTest.disabled = true;
      btnDump.disabled = true;
      log('\n--- カートリッジ疎通テストを実行中 ---');

      try {
        await sendCommand('TEST');
        const reader = port.readable.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        const startTime = Date.now();

        while (Date.now() - startTime < 4000) {
          const { value, done } = await Promise.race([
            reader.read(),
            new Promise(r => setTimeout(r, 400)).then(() => ({ value: null, done: false }))
          ]);
          if (value) {
            const text = decoder.decode(value);
            buffer += text;
            log(text.trimEnd());
            if (buffer.includes('TEST COMPLETE')) break;
          }
        }
        reader.releaseLock();
      } catch (err) {
        log('テストエラー: ' + err.message);
      } finally {
        btnTest.disabled = false;
        btnPinCheck.disabled = false; btnWireCheck.disabled = false; btnDiag.disabled = false;
        btnDump.disabled = false;
      }
    });

    // Cartridge Live Pin Contact Diagnostics
    btnPinCheck.addEventListener('click', async () => {
      btnTest.disabled = true;
      btnPinCheck.disabled = true;
      btnWireCheck.disabled = true;
      btnDiag.disabled = true;
      btnDump.disabled = true;
      log('\n========================================');
      log('🔍 カセット全ピン接触・導通診断を開始します...');

      let bufReader = null;
      try {
        await drainSerial(150);
        bufReader = new BufferedSerialReader(port.readable);
        await sendCommand('PINCHECK');

        const hdr = await bufReader.readLineMatching('=== PINCHECK START ===', 5000);
        if (!hdr) throw new Error('診断開始応答を受信できませんでした');

        const fails = [];
        let totalCount = 0;
        let passCount = 0;

        while (true) {
          const line = await bufReader.readLine(3000);
          if (!line || line.includes('=== PINCHECK END ===')) break;
          if (line.startsWith('PIN:')) {
            totalCount++;
            const parts = line.split(':');
            const pinName = parts[1];
            const status = parts[2];
            if (status === 'PASS') {
              passCount++;
            } else {
              const label = parts[3] || '';
              const pin = parts[4] || '';
              fails.push({ name: pinName, status, label, pin });
            }
          }
        }

        log('\n--- 診断結果サマリー ---');
        log(`検査ピン数: ${totalCount} 本 | 正常: ${passCount} 本 | 異常: ${fails.length} 本`);

        if (fails.length === 0) {
          log('🎉 【判定: ALL PASS】すべてのデータ線・アドレス線が正常に導通しています！');
          log('   カセットの接触は万全です。安全に吸い出しを開始できます。');
        } else {
          log('⚠️ 【判定: 要清掃・接触不良あり】以下のピンで異常を検知しました:');
          for (const f of fails) {
            let reason = '';
            if (f.status === 'FAIL_STUCK_HIGH') reason = '常時 HIGH (1固定・断線・浮きの疑い)';
            else if (f.status === 'FAIL_STUCK_LOW') reason = '常時 LOW (0固定・GND短絡の疑い)';
            else if (f.status === 'FAIL_ALIAS') reason = 'アドレス切替不達 (無反応・エイリアス)';
            log(`   ❌ [${f.name}] コネクタ端子: ${f.label} (Arduino: ${f.pin}) -> ${reason}`);
          }
          log('👉 対処: コネクタ端子（金メッキ）の清掃、または指定ピンのジャンパー線の押し込みを行ってください。');
        }
      } catch (err) {
        log('ピン診断エラー: ' + err.message);
      } finally {
        if (bufReader) { try { bufReader.release(); } catch (_) {} }
        btnTest.disabled = false;
        btnPinCheck.disabled = false;
        btnWireCheck.disabled = false;
        btnDiag.disabled = false;
        btnDump.disabled = false;
      }
    });

    // Rewiring & Short Circuit Diagnostics
    btnWireCheck.addEventListener('click', async () => {
      btnTest.disabled = true;
      btnPinCheck.disabled = true;
      btnWireCheck.disabled = true;
      btnDiag.disabled = true;
      btnDump.disabled = true;
      log('\n========================================');
      log('⚡ 配線・短絡（ショート）診断を開始します (カセット未挿入推奨)...');

      let bufReader = null;
      try {
        await drainSerial(150);
        bufReader = new BufferedSerialReader(port.readable);
        await sendCommand('WIRECHECK');

        const hdr = await bufReader.readLineMatching('=== WIRECHECK START ===', 5000);
        if (!hdr) throw new Error('診断開始応答を受信できませんでした');

        const gndFaults = [];
        const shortFaults = [];

        while (true) {
          const line = await bufReader.readLine(3000);
          if (!line || line.includes('=== WIRECHECK END ===')) break;
          if (line.startsWith('GND_FAULT:')) {
            const parts = line.split(':');
            gndFaults.push(`${parts[1]} (${parts[2]} / Arduino: ${parts[3]})`);
          } else if (line.startsWith('SHORT_FAULT:')) {
            shortFaults.push(line.replace('SHORT_FAULT:', ''));
          }
        }

        log('\n--- 配線チェック判定 ---');
        if (gndFaults.length === 0 && shortFaults.length === 0) {
          log('✅ 【判定: PASS】全配線正常！');
          log('   ピン同士の短絡（ショート）や、誤ったGND接続はありません。');
        } else {
          if (gndFaults.length > 0) {
            log('❌ 【GND短絡検知】本来GNDでないピンがGNDに接続されています:');
            gndFaults.forEach(g => log('   - ' + g));
          }
          if (shortFaults.length > 0) {
            log('❌ 【ピン間短絡検知】以下のピン同士が接触・ショートしています:');
            shortFaults.forEach(s => log('   - ' + s));
          }
        }
      } catch (err) {
        log('配線診断エラー: ' + err.message);
      } finally {
        if (bufReader) { try { bufReader.release(); } catch (_) {} }
        btnTest.disabled = false;
        btnPinCheck.disabled = false;
        btnWireCheck.disabled = false;
        btnDiag.disabled = false;
        btnDump.disabled = false;
      }
    });

    // Bank-switch Diagnostics
    btnDiag.addEventListener('click', async () => {
      btnTest.disabled = true;
      btnPinCheck.disabled = true; btnWireCheck.disabled = true; btnDiag.disabled = true;
      btnDump.disabled = true;
      log('\n========================================');
      log('🔍 バンク切り替え診断テストを開始します...');

      let bufReader = null;
      try {
        await drainSerial(150);
        bufReader = new BufferedSerialReader(port.readable);

        const readSample16 = async (addr) => {
          const cmd = `R ${addr.toString(16).toUpperCase()} 0010`;
          await sendCommand(cmd);
          const ok = await bufReader.readLineMatching('OK ', 3000);
          if (!ok) throw new Error(`読み出し応答エラー ($${addr.toString(16).toUpperCase()})`);
          const bytes = await bufReader.readExactBytes(16);
          await bufReader.readLineMatching('CRC ', 2000);
          return Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
        };

        const writeBank = async (reg, bank) => {
          await sendCommand(`P 8000 ${reg.toString(16).padStart(2, '0')}`);
          await new Promise(r => setTimeout(r, 12));
          await bufReader.readLine(500);
          await sendCommand(`P 8001 ${bank.toString(16).padStart(2, '0')}`);
          await new Promise(r => setTimeout(r, 12));
          await bufReader.readLine(500);
        };

        log('1. 切替前の初期状態 ($8000-$800F) を取得中...');
        const initDump = await readSample16(0x8000);
        log(`   [初期状態]: ${initDump}`);

        const results = [];
        for (let b = 0; b < 4; b++) {
          await writeBank(6, b); // R6 = 8KB PRG at $8000-$9FFF
          await new Promise(r => setTimeout(r, 20));
          const dump = await readSample16(0x8000);
          results.push(dump);
          log(`   [Bank ${b} に切替後]: ${dump}`);
        }

        const isAllSame = results.every(d => d === results[0]);
        log('\n--- 診断判定 ---');
        if (isAllSame) {
          log('❌ 【判定】バンク切り替えが全く反映されていません！');
          log('   Bank 0〜3のデータがすべて同一です。');
          log('   考えられる原因: M2クロック(B29/D10)、/ROMSEL(B17/D14)、CPU R/W(A17/D13) の接触不良、または書き込みパルス幅の不足。');
        } else {
          log('✅ 【判定】バンク切り替えは正常に動作しています！');
          log('   指定バンクごとにデータが正しく変化していることを確認しました。');
        }
      } catch (err) {
        log('診断エラー: ' + err.message);
      } finally {
        if (bufReader) {
          try { bufReader.release(); } catch (_) {}
        }
        btnTest.disabled = false;
        btnPinCheck.disabled = false; btnWireCheck.disabled = false; btnDiag.disabled = false;
        btnDump.disabled = false;
      }
    });

    async function drainSerial(durationMs = 150) {
      if (!port || !port.readable) return;
      const reader = port.readable.getReader();
      const start = Date.now();
      try {
        while (Date.now() - start < durationMs) {
          const remain = Math.max(20, durationMs - (Date.now() - start));
          const { value } = await Promise.race([
            reader.read(),
            new Promise(r => setTimeout(() => r({ value: null }), remain))
          ]);
          if (!value) break;
        }
      } catch (_) {
      } finally {
        try { reader.releaseLock(); } catch (_) {}
      }
    }

    // Byte-preserving buffered reader so binary bytes following '\n' in the same USB packet are never lost
    class BufferedSerialReader {
      constructor(readable) {
        this.reader = readable.getReader();
        this.queue = new Uint8Array(0);
      }

      _append(chunk) {
        if (!chunk || chunk.length === 0) return;
        const next = new Uint8Array(this.queue.length + chunk.length);
        next.set(this.queue, 0);
        next.set(chunk, this.queue.length);
        this.queue = next;
      }

      async readLine(timeoutMs = 5000) {
        const start = Date.now();
        while (Date.now() - start < timeoutMs) {
          const nlIdx = this.queue.indexOf(0x0A); // '\n'
          if (nlIdx !== -1) {
            const lineBytes = this.queue.subarray(0, nlIdx);
            this.queue = this.queue.subarray(nlIdx + 1);
            return new TextDecoder().decode(lineBytes).replace(/^[\r+]+|\r+$/g, '').trim();
          }
          const { value, done } = await Promise.race([
            this.reader.read(),
            new Promise(r => setTimeout(() => r({ value: null, done: false }), 500))
          ]);
          if (done) break;
          if (value) this._append(value);
        }
        return null;
      }

      async readLineMatching(prefix, timeoutMs = 5000) {
        const start = Date.now();
        while (Date.now() - start < timeoutMs) {
          const line = await this.readLine(timeoutMs - (Date.now() - start));
          if (line === null) return null;
          if (line.includes(prefix)) return line;
        }
        return null;
      }

      async readExactBytes(totalBytes, onProgress, timeoutMs = 15000) {
        const result = new Uint8Array(totalBytes);
        let received = 0;

        if (this.queue.length > 0) {
          const take = Math.min(totalBytes, this.queue.length);
          result.set(this.queue.subarray(0, take), 0);
          this.queue = this.queue.subarray(take);
          received += take;
          if (onProgress) onProgress(received, totalBytes);
        }

        const start = Date.now();
        while (received < totalBytes) {
          if (Date.now() - start > timeoutMs) {
            throw new Error(`バイナリ受信タイムアウト (${received}/${totalBytes} bytes)`);
          }
          const { value, done } = await Promise.race([
            this.reader.read(),
            new Promise(r => setTimeout(() => r({ value: null, done: false }), 1000))
          ]);
          if (done) break;
          if (value && value.length > 0) {
            const needed = totalBytes - received;
            if (value.length <= needed) {
              result.set(value, received);
              received += value.length;
            } else {
              result.set(value.subarray(0, needed), received);
              received += needed;
              this._append(value.subarray(needed));
            }
            if (onProgress) onProgress(received, totalBytes);
          }
        }
        return result;
      }

      release() {
        try { this.reader.releaseLock(); } catch (_) {}
      }
    }

    function computeCrc32Hex(bytes) {
      let crc = 0xFFFFFFFF >>> 0;
      for (let i = 0; i < bytes.length; i++) {
        crc ^= bytes[i];
        for (let j = 0; j < 8; j++) {
          crc = (crc & 1) ? ((crc >>> 1) ^ 0xEDB88320) >>> 0 : (crc >>> 1);
        }
      }
      return ((~crc) >>> 0).toString(16).toUpperCase().padStart(8, '0');
    }

    // Dump Button
    btnDump.addEventListener('click', async () => {
      btnTest.disabled = true;
      btnDump.disabled = true;
      progressBox.style.display = 'block';

      let bufReader = null;
      try {
        const prgKB = parseInt(prgSizeSelect.value, 10);
        const chrKB = parseInt(chrSizeSelect.value, 10);
        const mapper = parseInt(mapperSelect.value, 10);
        const mirroring = parseInt(mirroringSelect.value, 10); // 1 = Vertical, 0 = Horizontal

        const prgBytesTotal = prgKB * 1024;
        const chrBytesTotal = chrKB * 1024;
        const prgStartAddr = (prgKB === 16) ? 0xC000 : 0x8000;

        log(`\n========================================`);
        log(`吸い出し開始: Mapper ${mapper}, PRG ${prgKB}KB (開始: $${prgStartAddr.toString(16).toUpperCase()}), CHR ${chrKB}KB`);

        await drainSerial(150);
        bufReader = new BufferedSerialReader(port.readable);

        // 1. Read PRG-ROM
        let prgData = new Uint8Array(prgBytesTotal);
        progressLabel.textContent = `PRG-ROM (${prgKB}KB) を吸い出し中...`;
        progressBar.style.width = '0%';

        if (mapper === 4 || mapper === 206) {
          // MMC3 / Namcot 108 PRG-ROM Dump (e.g. 256KB = 32 x 8KB, 128KB = 16 x 8KB banks)
          // Banks 0..numBanks-3 are read in 16KB pairs via R6 ($8000-$9FFF) and R7 ($A000-$BFFF)
          const numBanks = prgKB / 8;
          const numPairs = (numBanks - 2) / 2;
          const mapperLabel = (mapper === 206) ? 'Namcot 108 (Mapper 206)' : 'MMC3';
          log(`${mapperLabel} PRG-ROM (${prgKB}KB / ${numBanks}バンク) バンク切り替え吸い出し中...`);

          // Disable PRG-RAM write protect just in case
          await sendCommand('P A001 00');
          await new Promise(r => setTimeout(r, 20));
          await bufReader.readLine(500);

          for (let p = 0; p < numPairs; p++) {
            const b6 = p * 2;
            const b7 = p * 2 + 1;
            // Select R6, write bank b6
            await sendCommand('P 8000 06');
            await new Promise(r => setTimeout(r, 10));
            await bufReader.readLine(500);
            await sendCommand(`P 8001 ${b6.toString(16).padStart(2, '0')}`);
            await new Promise(r => setTimeout(r, 10));
            await bufReader.readLine(500);

            // Select R7, write bank b7
            await sendCommand('P 8000 07');
            await new Promise(r => setTimeout(r, 10));
            await bufReader.readLine(500);
            await sendCommand(`P 8001 ${b7.toString(16).padStart(2, '0')}`);
            await new Promise(r => setTimeout(r, 10));
            await bufReader.readLine(500);

            // Read 16KB ($8000-$BFFF)
            await sendCommand('R 8000 4000');
            const hdr = await bufReader.readLineMatching('OK ', 5000);
            if (!hdr) throw new Error(`PRG ペア ${p} 開始応答が受信できませんでした`);
            const chunk = await bufReader.readExactBytes(16384, (done, total) => {
              const currentTotal = (p * 16384) + done;
              const pct = Math.floor((currentTotal / prgBytesTotal) * 50);
              progressBar.style.width = `${pct}%`;
              progressLabel.textContent = `PRG: ${currentTotal} / ${prgBytesTotal} bytes (${pct * 2}%)`;
            });
            prgData.set(chunk, p * 16384);
            await bufReader.readLineMatching('CRC ', 3000);
          }

          // Read fixed 16KB ($C000-$FFFF)
          await sendCommand('R C000 4000');
          const hdrFixed = await bufReader.readLineMatching('OK ', 5000);
          if (!hdrFixed) throw new Error(`PRG 固定バンク開始応答が受信できませんでした`);
          const fixedChunk = await bufReader.readExactBytes(16384, (done, total) => {
            const currentTotal = (numPairs * 16384) + done;
            const pct = Math.floor((currentTotal / prgBytesTotal) * 50);
            progressBar.style.width = `${pct}%`;
            progressLabel.textContent = `PRG: ${currentTotal} / ${prgBytesTotal} bytes (${pct * 2}%)`;
          });
          prgData.set(fixedChunk, numPairs * 16384);
          await bufReader.readLineMatching('CRC ', 3000);
        } else {
          // Standard PRG Read (NROM / CNROM)
          const prgCmd = `R ${prgStartAddr.toString(16).toUpperCase()} ${prgBytesTotal.toString(16).toUpperCase()}`;
          await sendCommand(prgCmd);

          const prgHdr = await bufReader.readLineMatching('OK ', 5000);
          if (!prgHdr) throw new Error('PRG開始応答 (OK) が受信できませんでした');
          log(`PRG応答: ${prgHdr}`);

          prgData = await bufReader.readExactBytes(prgBytesTotal, (done, total) => {
            const pct = Math.floor((done / total) * 50);
            progressBar.style.width = `${pct}%`;
            progressLabel.textContent = `PRG: ${done} / ${total} bytes (${pct * 2}%)`;
          });

          await bufReader.readLineMatching('CRC ', 3000);
        }

        const jsPrgCrc = computeCrc32Hex(prgData);
        log(`PRG-ROM 完了 (${prgData.length} bytes) | CRC32: ${jsPrgCrc}`);

        // 2. Read CHR-ROM (if exists) via 'C 0000 <len>' (with bank-switching)
        let chrData = new Uint8Array(chrBytesTotal);
        let jsChrCrc = 'N/A';
        if (chrBytesTotal > 0) {
          if (mapper === 4 || mapper === 206) {
            // MMC3 / Namcot 108 CHR-ROM Dump (e.g. 128KB = 16 x 8KB, 64KB = 8 x 8KB chunks)
            const num8k = chrKB / 8;
            const mapperLabel = (mapper === 206) ? 'Namcot 108 (Mapper 206)' : 'MMC3';
            log(`${mapperLabel} CHR-ROM (${chrKB}KB / ${num8k}チャンク) バンク切り替え吸い出し中...`);

            for (let c = 0; c < num8k; c++) {
              const base1k = c * 8;
              // R0 (2KB at $0000)
              await sendCommand('P 8000 00'); await new Promise(r => setTimeout(r, 6)); await bufReader.readLine(500);
              await sendCommand(`P 8001 ${base1k.toString(16).padStart(2, '0')}`); await new Promise(r => setTimeout(r, 6)); await bufReader.readLine(500);
              // R1 (2KB at $0800)
              await sendCommand('P 8000 01'); await new Promise(r => setTimeout(r, 6)); await bufReader.readLine(500);
              await sendCommand(`P 8001 ${(base1k + 2).toString(16).padStart(2, '0')}`); await new Promise(r => setTimeout(r, 6)); await bufReader.readLine(500);
              // R2 (1KB at $1000)
              await sendCommand('P 8000 02'); await new Promise(r => setTimeout(r, 6)); await bufReader.readLine(500);
              await sendCommand(`P 8001 ${(base1k + 4).toString(16).padStart(2, '0')}`); await new Promise(r => setTimeout(r, 6)); await bufReader.readLine(500);
              // R3 (1KB at $1400)
              await sendCommand('P 8000 03'); await new Promise(r => setTimeout(r, 6)); await bufReader.readLine(500);
              await sendCommand(`P 8001 ${(base1k + 5).toString(16).padStart(2, '0')}`); await new Promise(r => setTimeout(r, 6)); await bufReader.readLine(500);
              // R4 (1KB at $1800)
              await sendCommand('P 8000 04'); await new Promise(r => setTimeout(r, 6)); await bufReader.readLine(500);
              await sendCommand(`P 8001 ${(base1k + 6).toString(16).padStart(2, '0')}`); await new Promise(r => setTimeout(r, 6)); await bufReader.readLine(500);
              // R5 (1KB at $1C00)
              await sendCommand('P 8000 05'); await new Promise(r => setTimeout(r, 6)); await bufReader.readLine(500);
              await sendCommand(`P 8001 ${(base1k + 7).toString(16).padStart(2, '0')}`); await new Promise(r => setTimeout(r, 6)); await bufReader.readLine(500);

              // Read 8KB ($0000-$1FFF)
              await sendCommand('C 0000 2000');
              const chrHdr = await bufReader.readLineMatching('OK ', 5000);
              if (!chrHdr) throw new Error(`CHR チャンク ${c} 開始応答がありません`);

              const chunk = await bufReader.readExactBytes(8192, (done, total) => {
                const currentTotal = (c * 8192) + done;
                const pct = 50 + Math.floor((currentTotal / chrBytesTotal) * 50);
                progressBar.style.width = `${pct}%`;
                progressLabel.textContent = `CHR チャンク ${c+1}/${num8k}: ${currentTotal} / ${chrBytesTotal} bytes (${pct}%)`;
              });
              chrData.set(chunk, c * 8192);
              await bufReader.readLineMatching('CRC ', 3000);
            }
          } else {
            if (mapper === 185 || presetSelect.value.startsWith('mighty')) {
              // Unlock Mighty Bomb Jack / Mapper 185 CHR protection
              log('Mapper 185 CHRプロテクト解除コマンド (P 8000 11) を送信中...');
              await sendCommand('P 8000 11');
              await new Promise(r => setTimeout(r, 40));
              await bufReader.readLine(1000); // drain WROK
            }

            const numBanks = Math.max(1, Math.floor(chrBytesTotal / 8192));
            log(`CHR-ROM (${chrKB}KB / ${numBanks}バンク) を吸い出し中...`);

            for (let b = 0; b < numBanks; b++) {
              if (numBanks > 1 || mapper === 3) {
                // Switch CNROM CHR bank (write to $8000)
                const bankHex = b.toString(16).padStart(2, '0');
                await sendCommand(`P 8000 ${bankHex}`);
                await new Promise(r => setTimeout(r, 40));
                await bufReader.readLine(1000); // drain WROK
              }

              const chrCmd = `C 0000 2000`;
              await sendCommand(chrCmd);

              const chrHdr = await bufReader.readLineMatching('OK ', 5000);
              if (!chrHdr) throw new Error(`CHR バンク ${b} 開始応答 (OK) が受信できませんでした`);

              const bankChunk = await bufReader.readExactBytes(8192, (done, total) => {
                const currentTotal = (b * 8192) + done;
                const pct = 50 + Math.floor((currentTotal / chrBytesTotal) * 50);
                progressBar.style.width = `${pct}%`;
                progressLabel.textContent = `CHR バンク ${b+1}/${numBanks}: ${currentTotal} / ${chrBytesTotal} bytes (${pct}%)`;
              });

              chrData.set(bankChunk, b * 8192);

              const bankCrcLine = await bufReader.readLineMatching('CRC ', 3000);
              log(`  -> バンク ${b} (8KB) 完了 | ${bankCrcLine || ''}`);
            }
          }

          jsChrCrc = computeCrc32Hex(chrData);
          log(`CHR-ROM 全バンク完了 (${chrData.length} bytes) | Combined CRC32: ${jsChrCrc}`);

          // Preview CHR (Bank 0)
          renderChrTiles(chrData.subarray(0, 8192));
        }

        bufReader.release();
        bufReader = null;

        progressBar.style.width = '100%';
        progressLabel.textContent = '完了！iNESファイルを生成しています...';

        // 3. Build iNES file
        const inesHeader = new Uint8Array(16);
        inesHeader[0] = 0x4E; // 'N'
        inesHeader[1] = 0x45; // 'E'
        inesHeader[2] = 0x53; // 'S'
        inesHeader[3] = 0x1A; // EOF
        inesHeader[4] = prgKB / 16; // 16KB PRG units
        inesHeader[5] = chrKB / 8;  // 8KB CHR units
        inesHeader[6] = ((mapper & 0x0F) << 4) | (mirroring & 0x01); // Mapper lower nibble + Mirroring
        inesHeader[7] = (mapper & 0xF0); // Mapper upper nibble

        const totalNesSize = 16 + prgData.length + chrData.length;
        const nesRom = new Uint8Array(totalNesSize);
        nesRom.set(inesHeader, 0);
        nesRom.set(prgData, 16);
        nesRom.set(chrData, 16 + prgData.length);

        // Apply compatibility patch for Mighty Bomb Jack on Mapper 0
        if (presetSelect.value === 'mighty') {
          if (nesRom[16 + 0x2A] === 0xF0 && nesRom[16 + 0x2B] === 0xEA) {
            nesRom[16 + 0x2A] = 0xEA;
            nesRom[16 + 0x2B] = 0xEA;
            log('💡 Mapper 0 互換化パッチを適用しました ($802A: BEQ -> NOP NOP)');
          }
        }

        const combinedPayload = nesRom.subarray(16);
        const combinedCrc = computeCrc32Hex(combinedPayload);
        log(`Combined ROM CRC32: ${combinedCrc}`);
        log(`\n🎉 吸い出し成功！ 合計サイズ: ${nesRom.length} bytes`);
        downloadBlob(nesRom, outFileName.value || 'famicom_rom.nes');
      } catch (err) {
        log('❌ 吸い出し中にエラーが発生しました: ' + err.message);
      } finally {
        if (bufReader) bufReader.release();
        btnTest.disabled = false;
        btnPinCheck.disabled = false; btnWireCheck.disabled = false; btnDiag.disabled = false;
        btnDump.disabled = false;
      }
    });

    function downloadBlob(data, filename) {
      const blob = new Blob([data], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      log(`📥 ファイルをダウンロードしました: ${filename}`);
    }

    // Render CHR 8x8 tiles (2bpp NES format)
    // 1 tile = 16 bytes.
    // Plane 0: bytes 0..7, Plane 1: bytes 8..15
    function renderChrTiles(chrBytes) {
      const numTiles = Math.min(512, Math.floor(chrBytes.length / 16));
      chrCtx.fillStyle = '#000000';
      chrCtx.fillRect(0, 0, 256, 128);

      const colors = [
        [0, 0, 0],       // Color 0: Black
        [229, 37, 33],   // Color 1: Famicom Red
        [212, 175, 55],  // Color 2: Gold
        [255, 255, 255]  // Color 3: White
      ];

      const imgData = chrCtx.createImageData(256, 128);
      const d = imgData.data;

      // 32 tiles per row (32 * 8 = 256px), 16 rows (16 * 8 = 128px)
      for (let t = 0; t < numTiles; t++) {
        const tileOffset = t * 16;
        const tileCol = t % 32;
        const tileRow = Math.floor(t / 32);

        for (let y = 0; y < 8; y++) {
          const plane0 = chrBytes[tileOffset + y];
          const plane1 = chrBytes[tileOffset + 8 + y];

          for (let x = 0; x < 8; x++) {
            const bit = 7 - x;
            const c0 = (plane0 >> bit) & 1;
            const c1 = (plane1 >> bit) & 1;
            const colIdx = (c1 << 1) | c0;

            const px = (tileCol * 8) + x;
            const py = (tileRow * 8) + y;
            const idx = (py * 256 + px) * 4;

            const rgb = colors[colIdx];
            d[idx + 0] = rgb[0];
            d[idx + 1] = rgb[1];
            d[idx + 2] = rgb[2];
            d[idx + 3] = 255;
          }
        }
      }
      chrCtx.putImageData(imgData, 0, 0);
      log('キャラクタプレビューを描画しました。');
    }
  </script>
